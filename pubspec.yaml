name: thud

description: THUD acoustic inspection app
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.13.1
  printing: ^5.15.1
  tflite_flutter: ^0.12.1
  record: ^7.2.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.6
  web: ^1.1.1

  material_ui: any
  cupertino_ui: ^1.1.6

flutter:
  uses-material-design: true
  assets:
    - assets/models/yamnet-waveform-embedding-f32.tflite
  shaders:
    - shaders/acoustic_field.frag
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
