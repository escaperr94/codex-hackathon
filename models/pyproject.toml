[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thud-baseline"
version = "0.1.0"
description = "Local acoustic tap research baselines; not a certified physical inspector"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
deep = ["torch>=2.0,<3"]
pretrained = ["tensorflow>=2.19,<2.20", "tf-keras>=2.19,<2.20", "tensorflow-hub>=0.16,<0.17"]
efficientat = ["torch>=2.6,<3", "torchvision>=0.21,<1", "torchaudio>=2.6,<3", "librosa>=0.10,<1"]
dev = ["pytest>=7,<10"]

[project.scripts]
thud = "thud.__main__:main"

[tool.setuptools.packages.find]
include = ["thud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
